<svg width="640" height="236" viewBox="0 0 640 236" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Most used languages</title>
  <desc id="desc">Language usage across DevMPoveaCL public repositories: TypeScript 83.3%, NSIS 10.1%, CSS 5.2%, Rust 1.3%, HTML 0.1%.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="640" y2="236" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#05070B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#FF2D95" flood-opacity="0.55"/>
    </filter>
    <style>
      .title { font: 700 24px 'Fira Code', Consolas, monospace; fill: #FF2D95; letter-spacing: 0.5px; }
      .subtitle { font: 500 12px 'Fira Code', Consolas, monospace; fill: #9CA3AF; }
      .label { font: 700 14px 'Fira Code', Consolas, monospace; fill: #F9FAFB; }
      .value { font: 600 13px 'Fira Code', Consolas, monospace; fill: #E5E7EB; }
      .muted { font: 500 11px 'Fira Code', Consolas, monospace; fill: #9CA3AF; }
    </style>
  </defs>

  <rect x="1" y="1" width="638" height="234" rx="18" fill="url(#card)" stroke="#FF2D95" stroke-opacity="0.9" stroke-width="2" filter="url(#glow)"/>
  <rect x="18" y="18" width="604" height="200" rx="13" fill="#06090F" stroke="#FF2D95" stroke-opacity="0.28"/>

  <text x="34" y="52" class="title">Most Used Languages</text>
  <text x="34" y="74" class="subtitle">Across my public repositories, generated as a local asset for reliable GitHub rendering.</text>

  <rect x="34" y="96" width="572" height="18" rx="9" fill="#111827"/>
  <rect x="34" y="96" width="476" height="18" rx="9" fill="#3178C6"/>
  <rect x="510" y="96" width="58" height="18" fill="#D4AA00"/>
  <rect x="568" y="96" width="30" height="18" fill="#663399"/>
  <rect x="598" y="96" width="7" height="18" fill="#DEA584"/>
  <rect x="605" y="96" width="1" height="18" rx="0.5" fill="#E34C26"/>

  <g transform="translate(34 136)">
    <circle cx="7" cy="-4" r="6" fill="#3178C6"/>
    <text x="22" y="1" class="label">TypeScript</text>
    <text x="158" y="1" class="value">83.3%</text>

    <circle cx="257" cy="-4" r="6" fill="#D4AA00"/>
    <text x="272" y="1" class="label">NSIS</text>
    <text x="352" y="1" class="value">10.1%</text>
  </g>

  <g transform="translate(34 168)">
    <circle cx="7" cy="-4" r="6" fill="#663399"/>
    <text x="22" y="1" class="label">CSS</text>
    <text x="82" y="1" class="value">5.2%</text>

    <circle cx="257" cy="-4" r="6" fill="#DEA584"/>
    <text x="272" y="1" class="label">Rust</text>
    <text x="342" y="1" class="value">1.3%</text>

    <circle cx="457" cy="-4" r="6" fill="#E34C26"/>
    <text x="472" y="1" class="label">HTML</text>
    <text x="548" y="1" class="value">0.1%</text>
  </g>

  <text x="34" y="202" class="muted">Public repo source: kurone-ko-timer. Documentation repos contain mostly Markdown and are not counted by GitHub language stats.</text>
</svg>
